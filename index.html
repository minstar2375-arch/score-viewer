<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>악보함</title>
  <meta name="description" content="PDF 악보를 모아 보고 필기하는 앱">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="악보함">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    // 화면이 뜨기 전에 적용해, 저장한 테마와 다른 색이 잠깐 보이지 않게 합니다.
    try {
      const theme = localStorage.getItem('score-viewer:theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch { /* 기기 설정을 따릅니다 */ }
  </script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.500A8.500 8.500 0 019.500 4a8.500 8.500 0 1010.500 10.500z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.600 5.600L7 7M17 17l1.400 1.400M5.600 18.400L7 17M17 7l1.400-1.400"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><path d="M5 4l14.500 7.500-6.300 1.700L10.500 20z"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4.500L16.500 4a2.100 2.100 0 013 3L8 18.500 4 20z"/></symbol>
      <symbol id="i-hl" viewBox="0 0 24 24"><path d="M9 14l-2 5h5l1.500-2.500"/><path d="M9 14l8-10 4 3.500-8 9.500z"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M8.500 20L3.700 15.200a2 2 0 010-2.800l8.700-8.700a2 2 0 012.800 0l5.100 5.100a2 2 0 010 2.800L12 20zM8.500 20H21M9 8l7 7"/></symbol>
      <symbol id="i-piano" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 13v6M15 13v6M7.500 5v8h3V5M13.500 5v8h3V5"/></symbol>
      <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="4.500" height="6.500" rx="1.500"/><rect x="16.500" y="14" width="4.500" height="6.500" rx="1.500"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.500 11.500a6.500 6.500 0 0013 0M12 18v3"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.500v13l10-6.500z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5.500v13M15 5.500v13"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.500 10.500L12 15l4.500-4.500M5 20h14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.500h6V7M6.500 7l1 13h9l1-13"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5L3.500 9.500 8 14"/><path d="M4 9.500h10.500a5.500 5.500 0 010 11H10"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M16 5l4.500 4.500L16 14"/><path d="M20 9.500H9.500a5.500 5.500 0 000 11H14"/></symbol>
    </defs>
  </svg>

  <section id="library">
    <header class="lib-header">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="32" height="32">
        <h1>악보함</h1>
      </div>
      <input id="search" type="search" placeholder="검색" aria-label="악보 찾기" hidden>
      <button type="button" id="themeToggle" class="theme-toggle"><svg class="icon" aria-hidden="true"><use id="themeIcon" href="#i-moon"/></svg></button>
      <div class="more-wrap">
        <button type="button" id="moreButton" class="theme-toggle" aria-label="더 보기" aria-haspopup="menu" title="더 보기"><svg class="icon more-icon" aria-hidden="true"><use href="#i-more"/></svg></button>
        <div id="moreMenu" class="card-menu more-menu" role="menu" hidden>
          <button type="button" id="backupSave" role="menuitem">백업 파일 저장</button>
          <button type="button" id="backupRestore" role="menuitem">백업에서 복원</button>
        </div>
      </div>
      <button type="button" class="primary" data-add>
        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
        추가
      </button>
      <input id="backupFile" type="file" hidden>
    </header>
    <main class="lib-main">
      <div id="sortBar" class="sort-bar" role="group" aria-label="정렬" hidden>
        <button type="button" data-sort="recent" aria-pressed="true">최근 본 순</button>
        <button type="button" data-sort="name" aria-pressed="false">가나다순</button>
      </div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="notice" hidden>
        <h2>악보가 없습니다</h2>
        <p>PDF를 추가하면 이 기기에 저장됩니다.</p>
        <button type="button" class="primary" data-add>PDF 추가</button>
      </div>
      <p id="noResult" class="notice" hidden>검색 결과가 없습니다.</p>
    </main>
    <input id="fileInput" type="file" accept="application/pdf,.pdf" multiple hidden>
    <div class="drop-veil" aria-hidden="true"><span>놓아서 추가</span></div>
  </section>

  <section id="viewer" hidden>
    <header class="topbar">
      <div class="bar-row">
        <div class="bar-left">
          <button type="button" id="backToLibrary" class="tb" aria-label="보관함으로" title="보관함으로">
            <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
          </button>
          <span id="viewerTitle" class="viewer-title"></span>
        </div>

        <div class="tools" role="group" aria-label="도구">
          <button type="button" class="tb tool" data-tool="view" aria-label="보기" title="보기"><svg class="icon" aria-hidden="true"><use href="#i-hand"/></svg></button>
          <button type="button" class="tb tool" data-tool="pen" aria-label="펜" title="펜"><svg class="icon" aria-hidden="true"><use href="#i-pen"/></svg></button>
          <button type="button" class="tb tool" data-tool="hl" aria-label="형광펜" title="형광펜"><svg class="icon" aria-hidden="true"><use href="#i-hl"/></svg></button>
          <button type="button" class="tb tool" data-tool="text" aria-label="글자" title="글자"><svg class="icon" aria-hidden="true"><use href="#i-text"/></svg></button>
          <button type="button" class="tb tool" data-tool="eraser" aria-label="지우개" title="지우개"><svg class="icon" aria-hidden="true"><use href="#i-eraser"/></svg></button>
          <span class="tool-divider" aria-hidden="true"></span>
          <button type="button" id="togglePiano" class="tb tool" aria-label="건반" title="건반" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-piano"/></svg></button>
          <button type="button" id="toggleRecorder" class="tb tool" aria-label="녹음" title="녹음" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg></button>
          <button type="button" id="toggleTracks" class="tb tool" aria-label="연습 음원" title="연습 음원" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-headphones"/></svg></button>
        </div>

        <div class="bar-right">
          <button type="button" id="undo" class="tb" aria-label="되돌리기" title="되돌리기"><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg></button>
          <button type="button" id="redo" class="tb" aria-label="다시 실행" title="다시 실행"><svg class="icon" aria-hidden="true"><use href="#i-redo"/></svg></button>
        </div>
      </div>

      <div id="toolOptions" class="options" hidden>
        <div id="colors" class="colors" role="group" aria-label="색상"></div>
        <div id="sizes" class="sizes" role="group" aria-label="굵기">
          <button type="button" class="size" data-size="0" aria-label="가늘게"><i style="--d:4px"></i></button>
          <button type="button" class="size" data-size="1" aria-label="보통"><i style="--d:8px"></i></button>
          <button type="button" class="size" data-size="2" aria-label="굵게"><i style="--d:12px"></i></button>
        </div>
        <button type="button" id="clearPage" class="clear-page" hidden>이 쪽 모두 지우기</button>
      </div>

      <div id="recPanel" class="rec-panel" role="region" aria-label="연습 녹음" hidden>
        <div class="rec-head">
          <button type="button" id="recMain" class="rec-main"><span class="rec-dot" aria-hidden="true"></span><span id="recMainText">녹음 시작</span></button>
          <span id="recTime" class="rec-time" hidden></span>
          <button type="button" id="recClose" class="tb rec-close" aria-label="녹음 창 닫기" title="닫기"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
        <ul id="recList" class="rec-list"></ul>
        <p id="recEmpty" class="rec-empty">이 악보의 녹음이 여기에 쌓입니다.</p>
      </div>

      <div id="trackPanel" class="rec-panel" role="region" aria-label="연습 음원" hidden>
        <div class="rec-head">
          <button type="button" id="trackAddFile" class="rec-main">음원 파일 추가</button>
          <button type="button" id="trackAddLink" class="rec-main">YouTube Music 링크</button>
          <button type="button" id="trackClose" class="tb rec-close" aria-label="연습 음원 창 닫기" title="닫기"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
        <ul id="trackList" class="rec-list"></ul>
        <p id="trackEmpty" class="rec-empty">베이스 파트 MP3나 곡 링크를 이 악보에 연결해 보세요.</p>
        <input id="trackFile" type="file" accept="audio/*,video/mp4,.mp3,.mp4,.m4a,.wav,.aac,.ogg" multiple hidden>
      </div>
    </header>

    <button type="button" id="recPill" class="rec-pill" aria-label="녹음 정지" hidden><span class="rec-dot" aria-hidden="true"></span><span id="recPillTime">0:00</span><span>정지</span></button>

    <div id="stage" class="stage">
      <div id="stageMsg" class="stage-msg" hidden>불러오는 중…</div>
      <div id="sheet" class="sheet" hidden>
        <canvas id="pdfCanvas"></canvas>
        <canvas id="inkCanvas"></canvas>
        <input id="textEntry" class="text-entry" type="text" enterkeyhint="done" autocomplete="off" aria-label="악보에 넣을 글자" hidden>
      </div>
    </div>

    <aside id="ytBox" class="yt-box" aria-label="YouTube 플레이어" hidden>
      <div id="ytHandle" class="yt-handle">
        <span>끌어서 옮기기</span>
        <a id="ytOpen" href="https://music.youtube.com/" target="_blank" rel="noopener">앱에서 열기</a>
      </div>
      <div id="ytFrame" class="yt-frame"></div>
      <div id="ytError" class="yt-error" hidden>
        <p id="ytErrorText"></p>
        <a id="ytErrorOpen" href="https://music.youtube.com/" target="_blank" rel="noopener">YouTube Music에서 열기</a>
      </div>
    </aside>

    <section id="practiceBar" class="practice-bar" aria-label="연습 음원 재생" hidden>
      <div class="practice-main">
        <div class="practice-info"><span id="practiceName" class="practice-name"></span><span id="practiceTime" class="practice-time"></span></div>
        <input id="practiceSeek" class="practice-seek" type="range" min="0" max="0" step="0.05" value="0" aria-label="재생 위치">
      </div>
      <div class="practice-controls">
        <button type="button" id="practicePlay" class="practice-play"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg><span>재생</span></button>
        <button type="button" id="practiceBack" class="tb practice-text" aria-label="5초 뒤로" title="5초 뒤로">−5초</button>
        <button type="button" id="practiceForward" class="tb practice-text" aria-label="5초 앞으로" title="5초 앞으로">+5초</button>
        <div class="practice-group" role="group" aria-label="구간 반복">
          <span class="practice-label">구간</span>
          <button type="button" id="practiceA" class="tb practice-loop" aria-label="반복 시작 지점" title="반복 시작 지점">A</button>
          <button type="button" id="practiceB" class="tb practice-loop" aria-label="반복 끝 지점" title="반복 끝 지점">B</button>
        </div>
        <label class="practice-group"><span class="practice-label">속도</span><select id="practiceSpeed" class="practice-speed"></select></label>
        <button type="button" id="practiceClose" class="tb practice-close" aria-label="재생 끝내기" title="재생 끝내기"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
    </section>

    <section id="piano" class="piano" aria-label="피아노 건반" hidden>
      <div class="piano-bar">
        <button type="button" id="pianoDown" class="tb" aria-label="한 옥타브 낮게" title="한 옥타브 낮게"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
        <span id="pianoRange" class="piano-range" aria-live="polite"></span>
        <button type="button" id="pianoUp" class="tb" aria-label="한 옥타브 높게" title="한 옥타브 높게"><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
        <button type="button" id="pianoLabels" class="piano-labels" title="음 이름 표시 바꾸기"></button>
        <a class="piano-credit" href="https://github.com/sfzinstruments/SalamanderGrandPiano" target="_blank" rel="noopener">Salamander Grand Piano, Alexander Holm, CC BY 3.0</a>
        <button type="button" id="pianoClose" class="tb piano-close" aria-label="건반 닫기" title="건반 닫기"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <div id="pianoKeys" class="piano-keys"></div>
    </section>

    <footer class="bottombar">
      <button type="button" id="prevPage" class="tb" aria-label="이전 쪽" title="이전 쪽"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
      <input id="pageSlider" type="range" min="1" max="1" value="1" aria-label="쪽 이동">
      <span id="pageLabel" class="page-label" aria-live="polite"></span>
      <button type="button" id="nextPage" class="tb" aria-label="다음 쪽" title="다음 쪽"><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
    </footer>
  </section>

  <dialog id="dlg">
    <form method="dialog">
      <h2 id="dlgTitle"></h2>
      <p id="dlgMessage"></p>
      <input id="dlgInput" type="text" aria-labelledby="dlgTitle" hidden>
      <div class="dlg-actions">
        <button type="submit" id="dlgOk" class="primary" value="ok"></button>
        <button type="button" id="dlgCancel" class="secondary">취소</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
