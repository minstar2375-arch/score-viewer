<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>악보함</title>
  <meta name="description" content="PDF 악보를 모아 보고 필기하는 앱">
  <meta name="theme-color" content="#2b2723">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="악보함">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.500 12 21.500 12 18 18.500 12 18.500 2.500 12 2.500 12z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4.500L16.500 4a2.100 2.100 0 013 3L8 18.500 4 20z"/><path d="M14.500 6l3 3"/></symbol>
      <symbol id="i-hl" viewBox="0 0 24 24"><path d="M9 14l-2 5h5l1.500-2.500"/><path d="M9 14l8-10 4 3.500-8 9.500z"/><path d="M3 21h18"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M8.500 20L3.700 15.200a2 2 0 010-2.800l8.700-8.700a2 2 0 012.800 0l5.100 5.100a2 2 0 010 2.800L12 20z"/><path d="M8.500 20H21M9 8l7 7"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 5L3.500 9.500 8 14"/><path d="M4 9.500h10.500a5.500 5.500 0 010 11H10"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M16 5l4.500 4.500L16 14"/><path d="M20 9.500H9.500a5.500 5.500 0 000 11H14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.500h6V7M6.500 7l1 13h9l1-13M10 11v5M14 11v5"/></symbol>
      <symbol id="i-rename" viewBox="0 0 24 24"><path d="M4 20h4L19.500 8.500a2.100 2.100 0 00-3-3L5 17z"/><path d="M13 20h7"/></symbol>
    </defs>
  </svg>

  <section id="library">
    <header class="lib-header">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="36" height="36">
        <h1>악보함</h1>
      </div>
      <input id="search" type="search" placeholder="악보 찾기" aria-label="악보 찾기" hidden>
      <button type="button" class="primary" data-add>
        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
        악보 추가
      </button>
    </header>
    <main class="lib-main">
      <div id="grid" class="grid"></div>
      <div id="empty" class="notice" hidden>
        <h2>첫 악보를 추가해 보세요</h2>
        <p>PDF 파일을 고르거나 이 화면에 끌어다 놓으면 보관함에 저장됩니다.<br>파일은 이 기기 안에만 저장돼요.</p>
        <button type="button" class="primary" data-add>PDF 고르기</button>
      </div>
      <p id="noResult" class="notice" hidden>찾는 악보가 없습니다.</p>
    </main>
    <input id="fileInput" type="file" accept="application/pdf,.pdf" multiple hidden>
    <div class="drop-veil" aria-hidden="true"><span>여기에 놓으면 보관함에 추가돼요</span></div>
  </section>

  <section id="viewer" hidden>
    <header class="topbar">
      <div class="bar-row">
        <button type="button" id="backToLibrary" class="tb" aria-label="보관함으로" title="보관함으로">
          <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
        </button>
        <span id="viewerTitle" class="viewer-title"></span>

        <div class="tools" role="group" aria-label="도구">
          <button type="button" class="tb tool" data-tool="view"><svg class="icon" aria-hidden="true"><use href="#i-hand"/></svg><span>보기</span></button>
          <button type="button" class="tb tool" data-tool="pen"><svg class="icon" aria-hidden="true"><use href="#i-pen"/></svg><span>펜</span></button>
          <button type="button" class="tb tool" data-tool="hl"><svg class="icon" aria-hidden="true"><use href="#i-hl"/></svg><span>형광펜</span></button>
          <button type="button" class="tb tool" data-tool="text"><svg class="icon" aria-hidden="true"><use href="#i-text"/></svg><span>글자</span></button>
          <button type="button" class="tb tool" data-tool="eraser"><svg class="icon" aria-hidden="true"><use href="#i-eraser"/></svg><span>지우개</span></button>
        </div>

        <div class="group" role="group" aria-label="편집">
          <button type="button" id="undo" class="tb" aria-label="되돌리기" title="되돌리기"><svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg></button>
          <button type="button" id="redo" class="tb" aria-label="다시 실행" title="다시 실행"><svg class="icon" aria-hidden="true"><use href="#i-redo"/></svg></button>
          <button type="button" id="clearPage" class="tb" aria-label="이 쪽 필기 모두 지우기" title="이 쪽 필기 모두 지우기"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg></button>
        </div>

        <div class="group zoom" role="group" aria-label="확대">
          <button type="button" id="zoomOut" class="tb" aria-label="축소" title="축소"><svg class="icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
          <button type="button" id="zoomLabel" class="tb zoom-label" title="화면에 맞추기">100%</button>
          <button type="button" id="zoomIn" class="tb" aria-label="확대" title="확대"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
        </div>
      </div>

      <div id="toolOptions" class="bar-row options" hidden>
        <div id="colors" class="colors" role="group" aria-label="색상"></div>
        <div class="sizes" role="group" aria-label="굵기">
          <button type="button" class="size" data-size="0" aria-label="가늘게"><i style="--d:4px"></i></button>
          <button type="button" class="size" data-size="1" aria-label="보통"><i style="--d:8px"></i></button>
          <button type="button" class="size" data-size="2" aria-label="굵게"><i style="--d:13px"></i></button>
        </div>
      </div>
    </header>

    <div id="stage" class="stage">
      <div id="stageMsg" class="stage-msg" hidden>불러오는 중…</div>
      <div id="sheet" class="sheet" hidden>
        <canvas id="pdfCanvas"></canvas>
        <canvas id="inkCanvas"></canvas>
        <input id="textEntry" class="text-entry" type="text" enterkeyhint="done" autocomplete="off" aria-label="악보에 넣을 글자" hidden>
      </div>
    </div>

    <footer class="bottombar">
      <button type="button" id="prevPage" class="tb" aria-label="이전 쪽" title="이전 쪽"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
      <input id="pageSlider" type="range" min="1" max="1" value="1" aria-label="쪽 이동">
      <span id="pageLabel" class="page-label" aria-live="polite"></span>
      <button type="button" id="nextPage" class="tb" aria-label="다음 쪽" title="다음 쪽"><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
    </footer>
  </section>

  <dialog id="dlg">
    <form method="dialog">
      <h2 id="dlgTitle"></h2>
      <p id="dlgMessage"></p>
      <input id="dlgInput" type="text" aria-labelledby="dlgTitle" hidden>
      <div class="dlg-actions">
        <button type="submit" id="dlgOk" class="primary" value="ok"></button>
        <button type="button" id="dlgCancel">취소</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
